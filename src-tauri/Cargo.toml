[package]
name = "api-ui"
version = "0.1.0"
description = "Cliente de API offline, alternativa ao Postman"
authors = ["João Hudson <joaohudson29@gmail.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "api_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
